[project]
name = "saftimize"
version = "0.1.0"
description = "Batch ingestion of Swiss electricity and Zug weather data"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "defusedxml>=0.7,<1",
    "dagster>=1.11,<2",
    "dagster-webserver>=1.11,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
saftimize-ingest = "ingest.cli:main"
saftimize-transform = "ingest.transform:main"

[build-system]
requires = ["uv_build>=0.9,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ingest"

[tool.pytest.ini_options]
testpaths = ["tests"]
